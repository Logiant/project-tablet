<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Georgia, serif">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2f1f"/>
      <stop offset="1" stop-color="#3a2418"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#ground)"/>

  <!-- river -->
  <path d="M 80 675 C 220 520, 180 380, 340 280 S 620 120, 760 40" fill="none"
        stroke="#26619c" stroke-width="26" stroke-linecap="round" opacity="0.55"/>
  <path d="M 80 675 C 220 520, 180 380, 340 280 S 620 120, 760 40" fill="none"
        stroke="#3f7cac" stroke-width="10" stroke-linecap="round" opacity="0.8"/>

  <!-- trade routes -->
  <g stroke="#c9a227" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M 330 300 Q 560 250 820 330"/>
    <path d="M 330 300 Q 420 470 700 520"/>
    <path d="M 820 330 Q 800 440 700 520"/>
    <path d="M 820 330 Q 980 290 1090 200"/>
  </g>

  <!-- cities -->
  <g>
    <circle cx="330" cy="300" r="16" fill="#c9a227"/>
    <circle cx="330" cy="300" r="24" fill="none" stroke="#c9a227" opacity="0.45"/>
    <circle cx="820" cy="330" r="13" fill="#e8d9b0"/>
    <circle cx="700" cy="520" r="13" fill="#e8d9b0"/>
    <circle cx="1090" cy="200" r="10" fill="#e8d9b0" opacity="0.8"/>
  </g>
  <g fill="#f3e9d7" font-size="22" font-style="italic">
    <text x="330" y="268" text-anchor="middle">Your city</text>
    <text x="820" y="300" text-anchor="middle">Grain-dependent</text>
    <text x="700" y="560" text-anchor="middle">Specialized into wool</text>
    <text x="1090" y="172" text-anchor="middle" opacity="0.8">Nomads</text>
  </g>

  <!-- placeholder label -->
  <g text-anchor="middle">
    <rect x="350" y="600" width="500" height="44" fill="#1f4e79" stroke="#c9a227"/>
    <text x="600" y="629" fill="#f3e9d7" font-size="21" letter-spacing="2">PLACEHOLDER — DROP A REAL CAPTURE HERE</text>
  </g>
</svg>
