<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Georgia, serif">
  <defs>
    <linearGradient id="ground2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2f1f"/>
      <stop offset="1" stop-color="#3a2418"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#ground2)"/>

  <!-- chart frame -->
  <g stroke="#f3e9d7" stroke-width="2" opacity="0.7">
    <line x1="120" y1="80" x2="120" y2="540"/>
    <line x1="120" y1="540" x2="1080" y2="540"/>
  </g>
  <text x="92" y="320" fill="#f3e9d7" font-size="22" font-style="italic"
        transform="rotate(-90 92 320)" text-anchor="middle">grain price</text>
  <text x="600" y="580" fill="#f3e9d7" font-size="22" font-style="italic" text-anchor="middle">months</text>

  <!-- the Temple's ±30% band -->
  <rect x="120" y="240" width="960" height="160" fill="#26619c" opacity="0.28"/>
  <line x1="120" y1="320" x2="1080" y2="320" stroke="#3f7cac" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="140" y="232" fill="#9fc2dd" font-size="20" font-style="italic">Temple stability band</text>

  <!-- temple reserves draining -->
  <path d="M 120 420 L 380 430 L 560 455 L 700 490 L 800 532 L 830 540" fill="none"
        stroke="#e8d9b0" stroke-width="4" stroke-dasharray="3 7" opacity="0.85"/>
  <text x="430" y="470" fill="#e8d9b0" font-size="20" font-style="italic">temple reserves</text>

  <!-- price: held in band, then the engineered spike -->
  <path d="M 120 330 C 220 300, 280 350, 380 325 S 560 300, 660 335 S 780 360, 830 330
           C 870 290, 900 200, 940 150 S 1020 95, 1080 88"
        fill="none" stroke="#c9a227" stroke-width="5"/>
  <circle cx="830" cy="330" r="8" fill="#c9a227"/>
  <text x="845" y="170" fill="#c9a227" font-size="22" font-style="italic">the spike goes through</text>

  <!-- placeholder label -->
  <g text-anchor="middle">
    <rect x="350" y="600" width="500" height="44" fill="#1f4e79" stroke="#c9a227"/>
    <text x="600" y="629" fill="#f3e9d7" font-size="21" letter-spacing="2">PLACEHOLDER — DROP A REAL CAPTURE HERE</text>
  </g>
</svg>
